<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>FAME - Login</title>

    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.css" rel="stylesheet">
	<!-- jquery-->
	<script src="js/jquery.js"></script>
	<!-- registration-->
    <script type="text/javascript" src="js/main.js"></script>
	<script src="js/register.js"></script>

</head>
<style>
#mypreloader2 {
	display: none;
	width: 100%;
	top: 50%;
	position: fixed;
	z-index: 1;
}
.myloader2 {
	display: block;
	position: relative;
	z-index: 1000;
	max-width: 75px;
	min-width: 70px;
	margin-left: auto;
	margin-right: auto;
}	
</style>
<body class="bg-gradient-login">
	<div id="mypreloader2">
        <div class="myloader2"><img src="img/loader.gif" style="height: 100%; width: 100%;"></div>
    </div>
    <div class="container">

        <!-- Outer Row -->
        <div class="row justify-content-center">

            <div class="col-xl-6 col-lg-6 col-md-6">

                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="p-5">
                                    <div class="text-center">
                                        <img src="img/fame_logo.png" class="fame_logo"/>
                                    </div>
                                    <!-- <form class="user"> -->
										<div class="form-group">
										<label for="" class="control-label">Language</label>
                                            <select class="form-control" aria-label="Default select example">
											  <option selected>-- Select Language --</option>
											  <option value="1">English</option>
											  <option value="2">Filipino</option>
											  <option value="3">Japan</option>
											</select>
										</div>
                                        <div class="form-group">
										<label for="" class="control-label">Full name</label>
                                            <input type="text" class="form-control form-control-user"
                                                id="fullname" aria-describedby="emailHelp"
                                                placeholder="Fullname...">
                                        </div>
										<div class="form-group">
										<label for="" class="control-label">Email Address</label>
                                            <input type="email" class="form-control form-control-user"
                                                id="email" aria-describedby="emailHelp"
                                                placeholder="Email Address">
                                        </div>
										<div class="form-group">
										<label for="" class="control-label">Username</label>
                                            <input type="username" class="form-control form-control-user"
                                                id="username" aria-describedby="emailHelp"
                                                placeholder="Username">
                                        </div>
										
                                        <div class="form-group">
										<label for="" class="control-label">Password</label>
                                            <input type="password" class="form-control form-control-user"
                                                id="userpassword" placeholder="Password">
                                        </div>
										<div class="form-group">
										<label for="" class="control-label">Confirm Password</label>
                                            <input type="password" class="form-control form-control-user"
                                                id="conpassword" placeholder="Confirm Password">
                                        </div>
										<div class="text-right">
											<a class="small" href="forgot-password.html">Forgot Password?</a>
										</div>
                                        <!-- <div class="form-group"> -->
                                            <!-- <div class="custom-control custom-checkbox small"> -->
                                                <!-- <input type="checkbox" class="custom-control-input" id="customCheck"> -->
                                                <!-- <label class="custom-control-label" for="customCheck">Remember -->
                                                    <!-- Me</label> -->
                                            <!-- </div> -->
                                        <!-- </div> -->
										<button type="submit" class="btn btn-primary btn-user btn-block" id="save_btn" onclick="save_newuser()">Register</button>
                                    <!-- </form> -->
                                    <hr>
                                  
                                    <div class="text-center">
                                        Already registered? <a class="small" href="login.html"><b>Login here</b></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>

</body>

</html>
