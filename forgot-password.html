<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>FAME - Forgot Password</title>

    <!-- Custom fonts for this template-->
    <link
      href="vendor/fontawesome-free/css/all.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
      rel="stylesheet"
    />

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.css" rel="stylesheet" />
    <script type="text/javascript" src="js/main.js"></script>
  </head>

  <body class="bg-gradient-login">
    <div class="container">
      <!-- Outer Row -->
      <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-6 col-md-6">
          <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
              <!-- Nested Row within Card Body -->
              <div class="row">
                <div class="col-lg-12">
                  <div class="p-5">
                    <div class="text-center">
                      <img src="img/fame_logo.png" class="fame_logo" />
                    </div>
                    <div class="text-center">
                      <h1 class="h4 text-gray-900 mb-2">
                        Forgot Your Password?
                      </h1>
                      <p class="mb-4">
                        We get it, stuff happens. Just enter your email address
                        below and we'll send you a link to reset your password!
                      </p>
                    </div>
                    <div class="login-form-body">
                      <div class="form-gp myemail">
                        <input
                          type="email"
                          id="usermail"
                          class="form-control form-control-user"
                          placeholder="Email"
                        />
                        <i class="ti-email"></i>
                      </div>
                      <div style="display: none" class="mypass">
                        <div class="form-gp">
                          <label for="exampleInputPassword2"
                            >New Password</label
                          >
                          <input type="password" id="resetpassword" />
                          <i class="ti-lock"></i>
                        </div>
                        <div class="form-gp">
                          <label for="exampleInputPassword3"
                            >Confirm Password</label
                          >
                          <input type="password" id="confirmpassword" />
                          <i class="ti-lock"></i>
                        </div>
                      </div>
                      <div class="submit-btn-area mt-5">
                        <button
                          id="btn_reset"
                          type="submit"
                          class="btn btn-primary btn-user btn-block"
                        >
                          Reset
                        </button>
                      </div>
                      <br />
                    </div>

                    <hr />
                    <div class="text-center">
                      <a class="small" href="login.html"
                        >Already have an account? Login!</a
                      >
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <script src="js/access.js"></script>
    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>
  </body>
</html>
