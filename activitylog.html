                "ajax": {
                    "url": "data_activitylog.php",
                    "dataSrc": "results",
                },


				"order": [[ 2, "desc" ]],
				
				"columns": [
					
					//{ "data": "Photo", defaultContent: '' },
					{ "data": "user", defaultContent: '' },
					{ "data": "action", defaultContent: '' },

                    
                    {"data": "createdAt", type:"date", render: function (data) {
                        let date = new Date(data);
                        let month = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sept", "Oct", "Nov", "Dec"];
                        
                        let getlocaltime = date.toLocaleString([], {
                            hour: "2-digit",
                            minute: "2-digit",
                        });

                        return month[date.getMonth()] + " " + String("0" + date.getDate()).slice(-2) + ", " + date.getFullYear() + "<br>" + getlocaltime;
                    }},
				]
			} );
		});

	$(document).ready(function(){
	
			
			var checkedbox_map = localStorage.getItem("map");
			var checkedbox_notifications = localStorage.getItem("notifications");
			var checkedbox_dashboard = localStorage.getItem("dashboard");			
			var checkedbox_devices = localStorage.getItem("devices");
			var checkedbox_reports = localStorage.getItem("reports");
			var checkedbox_settings = localStorage.getItem("settings");

			
		$(function() {

				var get_emp = localStorage.getItem("regAuthor");
			if (get_emp == "admin") {
				document.getElementById("map2").style.display=checkedbox_map;
				document.getElementById("notifications").style.display=checkedbox_notifications;
				document.getElementById("dashboard").style.display=checkedbox_dashboard;
				document.getElementById("devices").style.display=checkedbox_devices;
				document.getElementById("reports").style.display=checkedbox_reports;
				document.getElementById("settings").style.display=checkedbox_settings;
				
			} else if (get_emp == "supervisor"){
				document.getElementById("map2").style.display=checkedbox_map;
				document.getElementById("notifications").style.display=checkedbox_notifications;
				document.getElementById("dashboard").style.display=checkedbox_dashboard;
				document.getElementById("devices").style.display=checkedbox_devices;
				document.getElementById("reports").style.display=checkedbox_reports;
				document.getElementById("settings").style.display=checkedbox_settings;
				
			} else if (get_emp == "user"){
				document.getElementById("map2").style.display=checkedbox_map;
				document.getElementById("notifications").style.display=checkedbox_notifications;
				document.getElementById("dashboard").style.display=checkedbox_dashboard;
				document.getElementById("devices").style.display=checkedbox_devices;
				document.getElementById("reports").style.display=checkedbox_reports;
				document.getElementById("settings").style.display=checkedbox_settings;
			} else {
				window.location.href = "login.html";
			}
			});
	});
	</script>
