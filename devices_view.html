    function CheckDimension() {
        
        var ext = $('#add_uploaded_image').val().split('.').pop();
        if($.inArray(ext, ['jpg','JPG']) == -1) {

        if(ext != ""){
            alert('Invalid extension ".'+ext+' ", only ".jpg" is allowed!');
        } else {
            alert('Image required, Kindly upload the image.');
        }


        } else {
            //Get reference of File.
            var fileUpload = document.getElementById("add_uploaded_image");

            //Check whether the file is valid Image.
            var regex = new RegExp("([a-zA-Z0-9\s_\\.\-:])+(.jpg)$");
            if (regex.test(fileUpload.value.toLowerCase())) {

                //Check whether HTML5 is supported.
                if (typeof (fileUpload.files) != "undefined") {
                    //Initiate the FileReader object.
                    var reader = new FileReader();
                    //Read the contents of Image File.
                    reader.readAsDataURL(fileUpload.files[0]);
                    reader.onload = function (e) {
                        //Initiate the JavaScript Image object.
                        var image = new Image();

                        //Set the Base64 string return from FileReader as source.
                        image.src = e.target.result;
                            
                        //Validate the File Height and Width.
                        image.onload = function () {
                            let height = this.height;
                            let width = this.width;
                            if (height > 512 || width > 512) {

                            //show width and height to user
                                // document.getElementById("width").innerHTML = width;
                                // document.getElementById("height").innerHTML= height;
                                alert("Height and Width must not exceed 512px.");
                                return false;
                            }
                                
                            add_device();
                            // alert("Uploaded image has valid Height and Width.");
                            return true;
                        };

                    }
                } else {
                    alert("This browser does not support HTML5.");
                    return false;
                }
            } else {
                alert("Please select a valid Image file.");
                return false;
            }            
        }

    }
