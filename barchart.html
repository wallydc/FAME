    <script>
    $(document).ready(function() {
    // 1. Fetch all devices in a single call to minimize API requests
    function getAllDevices() {
        return $.ajax({   
            type: 'GET',
            headers: {
                'X-Parse-Application-Id': "qIZJSomGlIEJLGzBLIZQQDHCTPSSNMLgMUd4VlRA",
                'X-Parse-REST-API-Key': "v7nVylPk8VeGBph6994YZMY6ONNVd4VTAMGTRmMH",
                'Content-Type': "application/json"
            }, 
            url: "https://pg-app-m8z2b4l7sm6v21liysy9fe27j8bf3f.scalabl.cloud/1/classes/Devices",   
            data: { order: '-createdAt', limit: 1000 },
            dataType: "json"
        });
    }

    getAllDevices().done(function(response) {
        if (!response || !response.results) return;

        // Standard 12 months for the chart labels
        const months = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        // Arrays to hold device counts for each month (indices 0 to 11)
        const counts2024 = new Array(12).fill(0);
        const counts2026 = new Array(12).fill(0);

        // 2. Parse dates automatically and separate by year
        response.results.forEach(device => {
            if (device.createdAt) {
                const date = new Date(device.createdAt);
                const year = date.getFullYear();
                const monthIndex = date.getMonth(); // 0 = Jan, 11 = Dec

                if (year === 2024) {
                    counts2024[monthIndex]++;
                } else if (year === 2026) {
                    counts2026[monthIndex]++;
                }
            }
        });

        // 3. BUILD THE BAR CHART
        buildBarChart(months, counts2024, counts2026);

    }).fail(function() {
        console.error("Failed to fetch device data for the bar chart.");
    });
});

// 4. The Bar Chart Rendering Function
function buildBarChart(labels, data2024, data2026) {
    var ctx = document.getElementById('myBarChart').getContext('2d');
    
    // Destroy previous instance to prevent rendering bugs
    if (window.myBar) { window.myBar.destroy(); }

    window.myBar = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels, // January - December
            datasets: [
                {
                    label: 'Devices registered 2024',
                    data: data2024,
                    backgroundColor: '#4e73df', // Blue matching your image style
                    borderWidth: 1
                },
                {
                    label: 'Devices registered 2026',
                    data: data2026,
                    backgroundColor: '#1cc88a', // Distinct color for 2026
                    borderWidth: 1
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 5 // Adjust scale steps to match image constraints (0, 5, 10, 15, 20)
                    }
                },
                x: {
                    ticks: {
                        maxRotation: 45,
                        minRotation: 45 // Rotates text exactly like your screenshot
                    }
                }
            },
            plugins: {
                legend: { position: 'top' }
            }
        }
    });
}
    </script>
