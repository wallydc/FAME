    /* Button Styling */
    .btn_tooltip {
        position: relative;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    /* Tooltip Styling */
    .tooltip {
        position: absolute;
        bottom: 130%; /* Position above the button */
        left: 50%;
        transform: translateX(-50%);
        background-color: #080f5d;
        color: #ffffff;
        padding: 8px 10px;
        border-radius: 5px;
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease-in-out;
    }

    /* Tooltip Arrow */
    .tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border-width: 5px;
        border-style: solid;
        border-color: #333 transparent transparent transparent;
    }

    /* Show Tooltip on Hover */
    .btn_tooltip:hover .tooltip {
        opacity: 1;
        visibility: visible;
    }
