<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>FAME - Account</title>

    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.css" rel="stylesheet">
    <link href="css/next_page.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        * {
             box-sizing: border-box;
        }
        
        body {
            background-color: #f1f1f1;
        }
        
        /* #regForm {
            background-color: #ffffff;
            margin: 100px auto;
            font-family: Raleway;
            padding: 40px;
            width: 70%;
            min-width: 300px;
        } */
        
        h1 {
            text-align: center;  
        }
		
		.fame_verfy {
			width: 10%;
		}
        
        input {
            padding: 10px;
            width: 100%;
            font-size: 17px;
            font-family: Raleway;
            border: 1px solid #aaaaaa;
        }
        
        /* Mark input boxes that gets an error on validation: */
        input.invalid {
            background-color: #ffdddd;
        }
        
        /* Hide all steps by default: */
        .tab {
            display: none;
        }
        
        button {
            background-color: #006bfe;
            color: #ffffff;
            border: solid;
            padding: 10px 20px;
            font-size: 17px;
            font-family: Raleway;
            cursor: pointer;
            border-color: #5c89c7;
            border-style: solid;
            border-radius: 7px;
            border-width: revert;
        }
        
        button:hover {
            opacity: 0.8;
        }
        
        #prevBtn {
            background-color: #ffffff;
            color: #5c89c7;
        }
        
        /* Make circles that indicate the steps of the form: */
        .step {
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbbbbb;
            border: none;  
            border-radius: 50%;
            display: inline-block;
            opacity: 0.5;
        }
        
        .step.active {
            opacity: 1;
        }
        
        /* Mark the steps that are finished and valid: */
        .step.finish {
          background-color: #2d358d;
        }
        
        #saveBtn {
          display: none;
          float: right;
          margin: 0 0 0 3px;
        }
        
        /* ----------------- */
        
        .password-container{
          /* width: 400px; */
          position: relative;
        }
        .password-container input[type="password"],
        .password-container input[type="text"]{
          width: 100%;
          padding: 12px 36px 12px 12px;
          box-sizing: border-box;
        }
        .fa-eye{
          position: absolute;
          top: 28%;
          right: 4%;
          cursor: pointer;
          color: lightgray;
        }
        
        #savedetails {
            display: none;
        }

        @media only screen and (min-width: 575px) {
            #recovernumber {
                max-width: 75%; min-width: 70%;
            }
            #prevBtn, #nextBtn {
                max-width: 50%; min-width: 50%; float: right;
            }
        }
		.checkbox-lg .form-check-input{
		 top: .8rem;
		 scale: 1.4;
		 margin-right: 0.7rem;
		 }
    </style>
    
    <script type="text/javascript" src="./js/jquery.js"></script>
</head>

<body><!--  class="bg-gradient-primary" -->

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-0">
                <!-- Nested Row within Card Body -->
                <div class="row">
                   <div class="col-lg-12">
                        <div class="p-5">
                            <div class="text-left">
                                <img src="img/fame_logo.png" class="fame_verfy" /> VERIFY
                            </div>
							<form id="msform">
								<!-- progressbar -->
								<ul id="progressbar">
									<li class="active" id="Device"><strong>Step 1</strong></li>
									<li id="measurement"><strong>Step 2</strong></li>
									<li id="geofence"><strong>Step 3</strong></li>
									<li id="photo"><strong>Step 4</strong></li>
									<li id="finish"><strong>Step 5</strong></li>
								</ul>
								<div class="progress">
									<div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
								</div> <br> 
								<!-- Add Device -->
								<fieldset>
									<div class="form-card">
										<div class="row">
											<div class="col-7">
												<h2 class="fs-title">Device Set up</h2>
											</div>
											<div class="col-5">
												<h2 class="steps">Step 1 - 5</h2>
											</div>
										</div> 
											<div class="form-group row">									 
											  <div class="col-lg-4">
											  <label style="font-size: 12px;">Enter Serial No.</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>
											  <div class="col-lg-4">
											  <label style="font-size: 12px;">Model No.</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>
											  <div class="col-lg-4">
											  <label style="font-size: 12px;">Type</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>									  
											</div>
								<div class="">
								<h2 class="h5 text-gray-900 mb-4" style="font-weight: bold; text-align: left; margin-bottom: 1rem !important; margin-top: 14px;">Maritime (Fish Vessel)</h2>
									<div class="form-group row">
									
									  <div class="col-lg-12">
										<label style="font-size: 12px;">Boat name</label>
										<div class="form-group">											
											<input type="text" class="form-control">
										</div>
									  </div>
									  <div class="col-lg-12">
										<label style="font-size: 12px;">Boat registration number</label>
										<div class="form-group">											
											<input type="text" class="form-control">
										</div>
									  </div>
									  <div class="col-lg-12">
										<label style="font-size: 12px;">License number of caption</label>
										<div class="form-group">											
											<input type="text" class="form-control">
										</div>
									  </div>
									  <div class="col-lg-12">
										<label style="font-size: 12px;">Name of caption</label>
										<div class="form-group">											
											<input type="text" class="form-control">
										</div>
									  </div>									  
									</div>
                                </div>
                                <div class="">
								<h2 class="h5 text-gray-900 mb-4" style="font-weight: bold; text-align: left; margin-bottom: 1rem !important; margin-top: 14px;">Land</h2>
									<div class="form-group row">
									
									  <div class="col-lg-12">
										<label style="font-size: 12px;">Purpose</label>
										<div class="form-group row">									 
										  <div class="col-lg-12">
											<div class="form-group">	
											<select class="form-control">
											  <option selected>-- Select --</option>
											  <option value="Ambulance">Ambulance</option>
											  <option value="Patrol 001">Patrol 001</option>
											</select>
											</div>
										  </div>									  
										</div>
										<label style="font-size: 12px;">Type</label>
										<div class="form-group row">									 
										  <div class="col-lg-12">
											<div class="form-group">	
											<select class="form-control">
												<option selected>-- Select --</option>
												<option value="Motor">Motorcycle</option>
												<option value="car">car</option>
												<option value="Truck">Truck</option>
												<option value="Bus">Bus</option>
											</select>
											</div>
										  </div>									  
										</div>
										
									</div>
									  <div class="col-lg-12">
										<label style="font-size: 12px;">Plate Number</label>
										<div class="form-group">											
											<input type="text" class="form-control">
										</div>
									  </div>
									  <div class="col-lg-12">
										<label style="font-size: 12px;">Driver's Name</label>
										<div class="form-group">											
											<input type="text" class="form-control">
										</div>
									  </div>
									  <div class="col-lg-12">
										<label style="font-size: 12px;">Driver's License</label>
										<div class="form-group">											
											<input type="text" class="form-control">
										</div>
									  </div>									  
									</div>
                                </div>

									</div> 
									<input type="button" name="next" class="next action-button btn btn-primary btn-user btn-block" value="Next" />
								</fieldset>
								<!-- Choose unit of measurement -->
								<fieldset>
									<div class="form-card">
										<div class="row">
											<div class="col-7">
												<h2 class="fs-title">Choose unit of measurement</h2>
											</div>
											<div class="col-5">
												<h2 class="steps">Step 2 - 5</h2>
											</div>
										</div> 
									<div class="form-card">
											<div class="form-group row">									 
											  <div class="col-lg-6">
											  <label style="font-size: 12px;">Sl</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>
											  <div class="col-lg-6">
											  <label style="font-size: 12px;">Imperial</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>									  
											</div>
											<div class="form-group row">									 
											  <div class="col-lg-3">
											  <label style="font-size: 12px;">Time</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>
											  <div class="col-lg-3">
											  <label style="font-size: 12px;">Length</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>
											  <div class="col-lg-3">
											  <label style="font-size: 12px;">Speed</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>
											  <div class="col-lg-3">
											  <label style="font-size: 12px;">Temperature</label>
												<div class="form-group">											
													<input type="text" class="form-control">
												</div>
											  </div>											  
											</div>
									</div> 

									</div> 
									<input type="button" name="next" class="next action-button" value="Next" /> 
									<input type="button" name="previous" class="previous action-button-previous" value="Previous" />
								</fieldset>
								<!-- Create geofence -->
								<fieldset>
									<div class="form-card">
										<div class="row">
											<div class="col-7">
												<h2 class="fs-title">Create geofence</h2>
											</div>
											<div class="col-5">
												<h2 class="steps">Step 3 - 5</h2>
											</div>
										</div> <br><br>
										<div class="form-group row">
										
										</div>
									</div>
									<input type="button" name="next" class="next action-button" value="Next" /> 
									<input type="button" name="previous" class="previous action-button-previous" value="Previous" />
								</fieldset>
								<!-- Photo Upload -->
								<fieldset>
									<div class="form-card">
										<div class="row">
											<div class="col-7">
												<h2 class="fs-title">Image Upload:</h2>
											</div>
											<div class="col-5">
												<h2 class="steps">Step 4 - 5</h2>
											</div>
										</div> 
										<label class="fieldlabels">Upload Ship Photo:</label> 
										<input type="file" name="pic" accept="image/*">
										<label class="fieldlabels">Upload Photo:</label>
										<input type="file" name="pic" accept="image/*">
									</div> 
									<input type="button" name="next" class="next action-button" value="Next" />
									<input type="button" name="previous" class="previous action-button-previous" value="Previous" />
								</fieldset>
								<!-- Final -->
								<fieldset>
									<div class="form-card">
										<div class="row">
											<div class="col-7">
												<h2 class="fs-title">Create geofence</h2>
											</div>
											<div class="col-5">
												<h2 class="steps">Step 5 - 5</h2>
											</div>
										</div> <br><br>
										<div class="form-group row">
                                        <div class="col-sm-12 mb-3 mb-sm-0">
                                            <h4 class="h5 text-gray-900 mb-4" style="font-weight: bold; text-align: left; margin-bottom: 1rem !important;">About you</h4>

                                                <label style="font-size: 12px;">Your recovery number</label><br>
                                                <select aria-label="Default select example" disabled="disabled" class="col-sm-3" style="height: 38px; border-radius: 6px;">
                                                    <option value="+63" selected="">+63</option>
                                                </select>
                                                <input oninput="this.className = ''" class="form-control form-control-user" id="recovernumber" name="recovernum" class="col-sm-9" onkeypress='return event.charCode >= 48 && event.charCode <= 57' style="float: right;" placeholder="XXX-XXX-XXXX">
                                        </div>

                                        <div class="col-sm-12">
                                            <label style="font-size: 12px;">Set new password</label>
                                            <div class="form-group">
                                                <input class="form-control form-control-user" type="password" placeholder="Must be at least 8 characters">
                                            </div>
                                        </div>

                                        <div class="col-sm-12">
                                            <label style="font-size: 12px;">Re-type new password</label>
                                            <div class="form-group">
                                                <input class="form-control form-control-user" type="password" placeholder="Must be at least 8 characters">
                                            </div>
                                        </div>
                                    </div>

									</div>
									<input type="button" name="" class="action-button" value="Submit" />
									<input type="button" name="previous" class="previous action-button-previous" value="Previous" />
								</fieldset>
							</form>

                        </div>
                    </div>
				
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="./js/multistep.js"></script>

    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>
	<!-- step next -->
    <script src="js/next_page.js"></script>

</body>

</html>
